plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-kapt'
    id 'kotlin-parcelize'
    id 'dagger.hilt.android.plugin'
    id 'androidx.navigation.safeargs.kotlin'
}

def keystoreDebugProperties = new Properties()
def keystoreDebugPropertiesFile = rootProject.file('key-debug.properties')

if (keystoreDebugPropertiesFile.exists()) {
    keystoreDebugProperties.load(new FileInputStream(keystoreDebugPropertiesFile))
}

def keystoreReleaseProperties = new Properties()
def keystoreReleasePropertiesFile = rootProject.file('key-release.properties')

if (keystoreReleasePropertiesFile.exists()) {
    keystoreReleaseProperties.load(new FileInputStream(keystoreReleasePropertiesFile))
}

android {

    namespace 'cn.ifafu.ifafu'

    compileSdk 34

    defaultConfig {
        applicationId "cn.ifafu.ifafu"
        minSdk 21
        targetSdk 33
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        versionCode 310
        versionName "1.0.1"
        resConfigs "zh"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += [
                        "room.schemaLocation"  : "$projectDir/schemas".toString(),
                        "room.incremental"     : "true",
                        "room.expandProjection": "true"]
            }
        }
    }

    signingConfigs {
        debug {
            if (keystoreDebugPropertiesFile.exists()) {
                keyAlias keystoreDebugProperties['keyAlias']
                keyPassword keystoreDebugProperties['keyPassword']
                storeFile file(keystoreDebugProperties['storeFile'])
                storePassword keystoreDebugProperties['storePassword']
            }
        }
        release {
            if (keystoreReleasePropertiesFile.exists()) {
                keyAlias keystoreReleaseProperties['keyAlias']
                keyPassword keystoreReleaseProperties['keyPassword']
                storeFile file(keystoreReleaseProperties['storeFile'])
                storePassword keystoreReleaseProperties['storePassword']
            }
        }
    }

    // Allows the same system integration fixtures to exercise the minified APK.
    testBuildType project.findProperty('integrationBuildType') ?: 'debug'

    buildTypes {

        debug {
            minifyEnabled false
            shrinkResources false
            //为debug版本的包名添加.debug后缀
            applicationIdSuffix ".debug"
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            manifestPlaceholders = [
                    app_name      : "@string/app_name",
                    app_icon      : "@mipmap/ic_fafu",
                    app_icon_round: "@mipmap/ic_fafu",
            ]
            signingConfig signingConfigs.debug
        }

        release {
            testProguardFiles "proguard-androidtest.pro"
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            manifestPlaceholders = [
                    app_name      : "@string/app_name",
                    app_icon      : "@mipmap/ic_fafu",
                    app_icon_round: "@mipmap/ic_fafu",
            ]
            // Use the standard debug key when the original private release key is
            // not present in a checkout. A real release build can still provide
            // key-release.properties to restore the original signing setup.
            signingConfig keystoreReleasePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "iFAFU-${defaultConfig.versionName}-${variant.buildType.name}.apk"
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
        freeCompilerArgs += ["-Xopt-in=kotlin.RequiresOptIn"]
    }
    buildFeatures {
        buildConfig true
        viewBinding true
        dataBinding true
    }
    sourceSets.main.assets.srcDir(rootProject.file('data'))
    lint {
        // This fork distributes APKs on GitHub, not Google Play. Preserve the
        // upstream target behavior while modernizing the build and UI; all other
        // fatal release checks remain enabled.
        disable 'ExpiredTargetSdkVersion'
    }
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.0"
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.core:core-splashscreen:1.0.1"
    implementation "androidx.activity:activity-ktx:1.8.0"
    implementation "androidx.fragment:fragment-ktx:1.6.2"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.constraintlayout:constraintlayout:2.1.3"
    implementation "androidx.cardview:cardview:1.0.0"
    implementation "androidx.viewpager2:viewpager2:1.0.0"
    implementation "androidx.gridlayout:gridlayout:1.0.0"
    // 1.11 fixes resource overrides on released Android 14/15 and exposes seed-color APIs.
    implementation 'com.google.android.material:material:1.11.0'
//    implementation 'com.tencent.tinker:tinker-android-lib:1.9.9'

    //https://developer.android.com/training/dependency-injection/hilt-android
    implementation "com.google.dagger:hilt-android:$hilt_version"
    kapt "com.google.dagger:hilt-android-compiler:$hilt_version"
    androidTestImplementation "com.google.dagger:hilt-android-testing:$hilt_version"
    kaptAndroidTest "com.google.dagger:hilt-android-compiler:$hilt_version"

    //https://developer.android.com/training/data-storage/room
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    kapt "androidx.room:room-compiler:$room_version"

    //https://developer.android.com/topic/libraries/architecture/lifecycle
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.2"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.6.2"
    implementation "androidx.lifecycle:lifecycle-common-java8:2.6.2"

    //https://developer.android.com/topic/libraries/architecture/paging/v3-overview
    implementation "androidx.paging:paging-runtime-ktx:3.1.1"

    //https://developer.android.com/guide/navigation
    implementation "androidx.navigation:navigation-fragment-ktx:2.7.5"
    implementation "androidx.navigation:navigation-ui-ktx:2.7.5"

    implementation "com.github.bumptech.glide:glide:$glide_version"
    kapt "com.github.bumptech.glide:compiler:$glide_version"
    implementation "com.afollestad.material-dialogs:core:$material_dialogs_version"
    implementation "com.afollestad.material-dialogs:color:$material_dialogs_version"
    implementation "com.afollestad.material-dialogs:datetime:$material_dialogs_version"
    // 网络框架
    implementation "com.squareup.okhttp3:okhttp:$okhttp_version"
    implementation "com.squareup.okhttp3:logging-interceptor:$okhttp_version"
    implementation "com.squareup.retrofit2:retrofit:$retrofit_version"
    implementation "com.squareup.retrofit2:converter-scalars:$retrofit_version"
    implementation "com.squareup.retrofit2:converter-gson:$retrofit_version"
    implementation "org.jsoup:jsoup:1.14.3"
    implementation 'com.alibaba:fastjson:1.2.79'

    implementation "com.github.CymChad:BaseRecyclerViewAdapterHelper:3.0.4"
    implementation "me.drakeet.multitype:multitype:4.0.0-alpha3"
    implementation "com.jakewharton.timber:timber:4.7.1"
    implementation "com.blankj:utilcodex:1.31.0"


    androidTestImplementation "androidx.test:runner:1.5.2"
    androidTestImplementation "androidx.test.ext:junit:1.1.5"
    testImplementation "junit:junit:4.13.2"
    testImplementation "androidx.room:room-testing:$room_version"
    androidTestImplementation 'com.android.support:support-annotations:28.0.0'
    androidTestImplementation 'com.android.support.test:runner:1.0.2'
    androidTestImplementation "androidx.test:core:1.4.0"
    androidTestImplementation "androidx.test:runner:1.4.0"
    androidTestImplementation "androidx.test.ext:junit:1.1.3"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.4.0"
}

kapt {
    correctErrorTypes true
}
