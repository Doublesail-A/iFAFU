name: School calendar data

on:
  schedule:
    - cron: '23 19 * * *'
  workflow_dispatch:
  push:
    paths: ['tools/calendars/**', '.github/workflows/calendar-data.yml']

permissions:
  contents: write

concurrency:
  group: school-calendar-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/material-you-redesign
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/calendars/requirements.txt
      - run: pip install -r tools/calendars/requirements.txt
      - run: python -m unittest discover -s tools/calendars -p 'test_*.py'
      - run: python tools/calendars/sync.py
      - name: Publish changed date data
        run: |
          if ! git diff --quiet -- data/school-calendars.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/school-calendars.json
            git commit -m 'Update published school calendar dates'
            git push origin HEAD:codex/material-you-redesign
          fi
