name: Android MD3

on:
  push:
    branches: ["codex/material-you-redesign"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --tests 'cn.ifafu.ifafu.ui.timetable.CourseColorPaletteTest' --tests 'cn.ifafu.ifafu.schedule.ScheduleEventsTest' --tests 'cn.ifafu.ifafu.update.GitHubReleasesTest' --tests 'cn.ifafu.ifafu.calendar.*' --tests 'cn.ifafu.ifafu.ui.widget.*' --tests 'cn.ifafu.ifafu.service.TimetableParserRegressionTest' :app:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: iFAFU-MD3-apps
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
